name: Web Security

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-*.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-*.yml"
  schedule:
    # Weekly on Monday 06:00 UTC — catches newly-disclosed CVEs in existing
    # dependencies, not just ones introduced by a given push/PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          source-root: web

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      # Kept in step with web-verify.yml and the `node:26-alpine` runtime images.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the job on high/critical severity advisories. Dependabot keeps
      # dependencies generally up to date, but this catches actively
      # exploited CVEs in between its weekly bumps and flags anything it
      # can't auto-resolve (e.g. no non-breaking fix available yet).
      #
      # `pnpm audit --audit-level=high` with one addition: an advisory with no
      # fix to upgrade to can be waived in web/audit-allowlist.json, with a
      # reason and an expiry date, so a merge freeze is not the only way past a
      # disclosure this project meets before the ecosystem has patched it. The
      # expiry is enforced — see scripts/check-audit.mjs.
      - name: Audit dependencies
        run: pnpm check:audit
