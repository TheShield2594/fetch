name: Baseline profile

# Run by hand from Actions → Baseline profile → Run workflow. Records the baseline and
# start-up profiles on an Android TV emulator, checks them, and uploads them as the
# `baseline-profiles` artifact to commit under app/src/main/generated/baselineProfiles/.
# See docs/performance.md, section 2.
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Also run StartupBenchmark (profile against no profile) on the emulator"
        type: boolean
        default: true
  # Temporary: records the first Fetch profiles from this branch. Removed before merge.
  push:
    branches: [claude/github-issue-401-q87wva]

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Record profiles on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator on GitHub-hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 33+ records profiles without root. The build needs no private configuration.
      - name: Record profiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:generateBaselineProfile; status=$?; adb logcat -d -s FetchJourney > journey-log.txt; adb pull /sdcard/Download/fetch-journey journey-screens || true; exit $status
            python3 scripts/check_baseline_profiles.py
            if [ "${{ github.event_name != 'workflow_dispatch' || inputs.benchmark }}" = "true" ]; then scripts/perf_baseline.sh benchmark-emulator || echo "::warning::StartupBenchmark failed; the profiles are still uploaded."; fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Profiles"
            echo '```'
            python3 scripts/check_baseline_profiles.py 2>&1 || true
            echo '```'
            echo "### StartupBenchmark (emulator, indicative only)"
            echo '```'
            python3 scripts/summarise_benchmark.py baselineprofile/build/outputs 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profiles
          path: app/src/main/generated/baselineProfiles/*.txt
          if-no-files-found: error

      # Where the scripted journey went: one log line and one screenshot per step.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-diagnostics
          path: |
            journey-log.txt
            journey-screens/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/**/*.json
            baselineprofile/build/outputs/androidTest-results/**/*.xml
            baselineprofile/build/reports/androidTests/**
          if-no-files-found: ignore
