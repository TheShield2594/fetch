name: Desktop

# Builds and tests the desktop app and the shared module, then packages the Linux builds.
# Runs without the Android SDK (`-Pfetch.desktopOnly=true`), which also proves :shared stays
# free of Android dependencies.
on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "desktop/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/build-arch-package.sh"
      - ".github/workflows/desktop.yml"
      # The desktop build reads versionName, fonts and strings from :app.
      - "app/build.gradle.kts"
      - "app/src/main/res/font/**"
      - "app/src/main/res/values*/strings.xml"
  pull_request:
    paths:
      - "shared/**"
      - "desktop/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/build-arch-package.sh"
      - ".github/workflows/desktop.yml"
      # The desktop build reads versionName, fonts and strings from :app.
      - "app/build.gradle.kts"
      - "app/src/main/res/font/**"
      - "app/src/main/res/values*/strings.xml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage needs rpmbuild for the .rpm; the .deb tools are already on the runner.
      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Tests
        run: ./gradlew --no-daemon -Pfetch.desktopOnly=true :shared:test :desktop:test

      - name: Packages
        run: ./gradlew --no-daemon -Pfetch.desktopOnly=true :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable

      # A portable build for distributions without .deb or .rpm: unpack and run bin/fetch.
      - name: Portable archive
        run: |
          cd desktop/build/compose/binaries/main/app
          tar -czf "$GITHUB_WORKSPACE/fetch-linux-x64.tar.gz" fetch

      # The native Arch Linux package, built by makepkg in an Arch container.
      - name: Arch Linux package
        run: |
          scripts/build-arch-package.sh fetch-linux-x64.tar.gz "$RUNNER_TEMP/arch"
          cp "$RUNNER_TEMP"/arch/*.pkg.tar.zst fetch-linux-x86_64.pkg.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: fetch-linux-x64
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            fetch-linux-x64.tar.gz
            fetch-linux-x86_64.pkg.tar.zst
          if-no-files-found: error
