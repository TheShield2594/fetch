name: Baseline profile

# Run by hand from Actions → Baseline profile → Run workflow. Records the baseline and
# start-up profiles on an Android TV emulator, checks them, and uploads them as the
# `baseline-profiles` artifact to commit under app/src/main/generated/baselineProfiles/.
# See docs/performance.md, section 2.
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Also run StartupBenchmark (profile against no profile) on the emulator"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Record profiles on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator on GitHub-hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator boots, so the two don't compete for the runner's memory.
      - name: Build the app and the journey
        run: |
          ./gradlew --no-daemon :app:assembleNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease
          ./gradlew --stop

      # API 33+ records profiles without root. The build needs no private configuration.
      - name: Record profiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            (adb logcat -s FetchJourney > journey-log.txt &); timeout 60m ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:generateBaselineProfile; status=$?; adb pull /sdcard/Download/fetch-journey journey-screens || true; exit $status
            python3 scripts/check_baseline_profiles.py
            if [ "${{ github.event_name != 'workflow_dispatch' || inputs.benchmark }}" = "true" ]; then adb logcat -c; adb logcat -v time -s FetchBenchmark ActivityManager:I > benchmark-log.txt & logcat_pid=$!; scripts/perf_baseline.sh benchmark-emulator || echo "::warning::StartupBenchmark failed; the profiles are still uploaded."; sleep 2; kill $logcat_pid 2>/dev/null; wait $logcat_pid 2>/dev/null; grep -E "FetchBenchmark|Start proc.*com\.fetch\.tv" benchmark-log.txt > benchmark-process-starts.txt || true; fi

      - name: Summarise
        if: always()
        run: |
          # An emulator that vanished mid-run was usually killed for memory; say so if it was.
          sudo dmesg | grep -i -E "out of memory|oom-kill|killed process" | tail -5 || true
          {
            echo "### Profiles"
            echo '```'
            python3 scripts/check_baseline_profiles.py 2>&1 || true
            echo '```'
            echo "### StartupBenchmark (emulator, indicative only)"
            echo '```'
            python3 scripts/summarise_benchmark.py baselineprofile/build/outputs 2>&1 || true
            echo '```'
            echo "### What started com.fetch.tv during StartupBenchmark (see #461)"
            echo '```'
            cat benchmark-process-starts.txt 2>/dev/null | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profiles
          path: app/src/main/generated/baselineProfiles/*.txt
          if-no-files-found: error

      # Where the scripted journey went: one log line and one screenshot per step.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-diagnostics
          path: |
            journey-log.txt
            journey-screens/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark-process-starts.txt
            baselineprofile/build/outputs/connected_android_test_additional_output/**/*.json
            baselineprofile/build/outputs/androidTest-results/**/*.xml
            baselineprofile/build/reports/androidTests/**
          if-no-files-found: ignore
