name: Release

# Run by hand from Actions → Release → Run workflow. Builds the release APKs from the chosen ref
# and publishes them as a GitHub Release under the tag. The Linux desktop packages are built after
# that and attached to the same release; the desktop is a personal tool and never gates a TV
# release, so a failure there leaves the published APK release as it is.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.0-beta.8"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signs with the release key when the FETCH_RELEASE_* secrets are set. Without them the
      # build falls back to the debug key: fine for sideloading, but such an install can't later
      # be updated in place by an APK signed with the release key.
      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FETCH_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.FETCH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FETCH_RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.FETCH_RELEASE_STORE_PASSWORD }}
        run: |
          # An empty secret reaches the build as an empty string, not an unset variable, so a
          # partial set would pass as configured and fail later on the blank credential.
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
              echo "::error::FETCH_RELEASE_KEYSTORE_BASE64 is set, but FETCH_RELEASE_KEY_ALIAS, FETCH_RELEASE_KEY_PASSWORD or FETCH_RELEASE_STORE_PASSWORD is empty."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "FETCH_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "FETCH_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "FETCH_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
              echo "FETCH_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          elif [ -n "$KEY_ALIAS" ] || [ -n "$KEY_PASSWORD" ] || [ -n "$STORE_PASSWORD" ]; then
            echo "::error::FETCH_RELEASE_KEY_ALIAS, FETCH_RELEASE_KEY_PASSWORD or FETCH_RELEASE_STORE_PASSWORD is set, but FETCH_RELEASE_KEYSTORE_BASE64 is empty."
            exit 1
          else
            echo "No release key configured; signing with the debug key."
          fi

      # Trakt, Simkl, MDBList, TMDB and the rest read their client IDs from these repository
      # secrets. An unset secret builds fine but leaves that integration showing "missing
      # credentials" in the app, so name each missing one in the job summary.
      - name: Assemble release APKs
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
        run: |
          for key in TRAKT_CLIENT_ID TRAKT_REDIRECT_URI SIMKL_CLIENT_ID MDBLIST_CLIENT_ID TMDB_API_KEY IMDB_TAPFRAME_API_BASE_URL IMDB_RATINGS_API_BASE_URL; do
            if [ -z "${!key//[[:space:]]/}" ]; then
              echo "::warning::Secret $key is not set; that integration will be unavailable in this build."
            fi
          done
          ./gradlew --no-daemon :app:assembleRelease

      - name: Name APKs after the tag
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-release(-unsigned)?$/\1/')
            cp "$apk" "dist/fetch-${{ inputs.tag }}-$abi.apk"
          done
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Fetch ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true

  # Runs once the APK release is out, so nothing here can hold up or fail the TV release.
  linux:
    name: Build and attach Linux packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage needs rpmbuild for the .rpm; the .deb tools are already on the runner.
      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Trakt, Simkl, TMDB and the IMDb episode-ratings services read the same repository
      # secrets as the TV app. An unset one builds fine but hides that feature (sign-in, Trakt
      # comments and More like this, the episode ratings grid), so name each missing one.
      - name: Build packages
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
        run: |
          for key in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID TMDB_API_KEY MDBLIST_CLIENT_ID IMDB_TAPFRAME_API_BASE_URL IMDB_RATINGS_API_BASE_URL; do
            if [ -z "${!key//[[:space:]]/}" ]; then
              echo "::warning::Secret $key is not set; that desktop feature will be unavailable in this build."
            fi
          done
          ./gradlew --no-daemon -Pfetch.desktopOnly=true :desktop:test :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable

      - name: Name packages after the tag
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/fetch-${{ inputs.tag }}-linux-amd64.deb"
          cp desktop/build/compose/binaries/main/rpm/*.rpm "dist/fetch-${{ inputs.tag }}-linux-x86_64.rpm"
          tar -czf "dist/fetch-${{ inputs.tag }}-linux-x64.tar.gz" -C desktop/build/compose/binaries/main/app fetch
          ls -l dist

      # The native Arch Linux package: the same app image, packaged by makepkg in an Arch container.
      - name: Arch Linux package
        run: |
          scripts/build-arch-package.sh "dist/fetch-${{ inputs.tag }}-linux-x64.tar.gz" "$RUNNER_TEMP/arch"
          cp "$RUNNER_TEMP"/arch/*.pkg.tar.zst "dist/fetch-${{ inputs.tag }}-linux-x86_64.pkg.tar.zst"
          ls -l dist

      # Adds the packages to the release the APK job published under the same tag.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.pkg.tar.zst
          fail_on_unmatched_files: true
