sdk.dir=/path/to/Android/sdk

# --- Optional API client IDs (features that need them stay hidden when blank) ---
TMDB_API_KEY=
TRAKT_CLIENT_ID=
TRAKT_CLIENT_SECRET=
# Must match the redirect URI registered on Trakt (https only), e.g. https://github.com/TheShield2594/fetch
TRAKT_REDIRECT_URI=
SIMKL_CLIENT_ID=
SIMKL_APP_NAME=fetch
# AniList API v2 client, registered with redirect URL https://anilist.co/api/v2/oauth/pin
ANILIST_CLIENT_ID=
# MyAnimeList API client (app type "other": no secret). Its App Redirect URL must equal
# MAL_REDIRECT_URI, which defaults to the callback page this repo publishes on GitHub Pages.
MAL_CLIENT_ID=
MAL_REDIRECT_URI=
MDBLIST_CLIENT_ID=
# Skip-intro markers for non-anime titles (IntroDB-compatible API). Blank uses the public
# https://api.introdb.app/; users can still pick another server in Settings → Advanced.
INTRODB_API_URL=
# Parents-guide lookup behind Settings → Content Warnings (off by default). Blank uses
# https://api.tiffara.com/.
PARENTAL_GUIDE_API_URL=
# Episode ratings grid on series pages (TV and desktop): the IMDb ratings service and the
# SeriesGraph-compatible one. Blank hides the grid. CI reads them from repository secrets.
IMDB_TAPFRAME_API_BASE_URL=
IMDB_RATINGS_API_BASE_URL=

# --- Release signing (debug signing is used when these are missing) ---
FETCH_RELEASE_STORE_FILE=
FETCH_RELEASE_KEY_ALIAS=
FETCH_RELEASE_KEY_PASSWORD=
FETCH_RELEASE_STORE_PASSWORD=

# --- Local FFmpeg decoder module (optional) ---
USE_LOCAL_FFMPEG_DECODER=false
FFMPEG_SOURCE_DIR=
FFMPEG_BUILD_DIR=

# --- DV7 / libdovi (Dolby Vision profile 7 → 8.1), optional ---
DOVI_NATIVE_ENABLED=false
DOVI_EXTRACTOR_HOOK_READY=false
DOVI_ENABLE_REAL_LINK=false
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
