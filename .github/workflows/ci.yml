name: CI

on:
  push:
    branches: [main]
    # The website under web/ has its own workflows (web-*.yml).
    paths-ignore:
      - "web/**"
      - ".github/workflows/web-*.yml"
  # No path filter on pull requests: the app jobs are required checks on `main`, and a check
  # that never reports blocks the merge. The `changes` job skips them instead when a pull
  # request only touches the website, and a skipped job counts as passing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job builds without any private configuration: no keys, no sync server, debug signing.
# The job names below are the required status checks on `main`; renaming one means updating
# the branch protection rule too.
jobs:
  # Decides whether the app jobs need to run. Only a pull request whose files are all under web/
  # (or are the website's own workflows) answers "false"; pushes, manual runs and any failure
  # here leave the app jobs running.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          app=true
          # One line per changed file: its path, then a tab and its old path if it was renamed,
          # so moving app code into web/ still runs the app jobs. The API lists at most 3,000
          # files, and a list that long may be incomplete, so it never counts as website-only.
          # grep without -q reads all of its input: an early exit would make printf fail with
          # SIGPIPE, and under pipefail that would read as "only web files".
          if [ "$EVENT" = "pull_request" ] &&
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
              --jq '.[] | [.filename, (.previous_filename // empty)] | join("\t")') &&
            [ -n "$files" ] &&
            [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ] &&
            ! printf '%s\n' "$files" | tr '\t' '\n' |
              grep -Ev '^(web/|\.github/workflows/web-[^/]*\.yml$)' > /dev/null; then
            app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App jobs needed: $app"

  build:
    name: Unit tests and debug APK
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Fails when startup-prof.txt copies baseline-prof.txt or Fetch code is not covered
      # (docs/performance.md, section 2).
      - name: Baseline and start-up profiles
        run: |
          (cd scripts && python3 -m unittest discover -s tests -t .)
          python3 scripts/check_baseline_profiles.py

      # Fails when locale_config.xml offers a language with no strings, or an offered language
      # falls under 60% translated (#445). The table goes to the job summary.
      - name: Locale coverage
        run: |
          python3 scripts/locale_coverage.py --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/locale_coverage.py --min 60

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: fetch-debug
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  release:
    name: Release APK (R8)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The minified, resource-shrunk release build, signed with the debug key. Catches R8
      # and keep-rule regressions before a manual release does.
      - name: Assemble release APK
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator on the hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the app and test APKs before the emulator starts, so emulator time is test time.
      - name: Build test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      # The emulator boots from a cached snapshot instead of cold-booting a fresh AVD each run, so
      # every run starts from the same known state (#490). The key names everything that shapes the
      # AVD below; a change to any of them must change the key too. baseline-profile.yml shares the
      # key and the snapshot, so change its settings with these. Bump the -v suffix to throw away
      # a bad snapshot. An emulator that can't load the snapshot (e.g. a newer emulator binary)
      # cold-boots instead, so a stale cache is slower, not broken.
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-34-android-tv-x86-tv_1080p-4c-4096M-v1

      # On a cache miss: create the AVD, boot it once and let the emulator save its snapshot on
      # exit. Same AVD settings and GPU mode as the test run, so that run can load the snapshot.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Saved the AVD snapshot for the cache."

      # An Android TV 14 emulator at 1080p, the same image baseline-profile.yml records on: the
      # UI tests assume a landscape TV screen and D-pad (non-touch) focus, and fail on a phone.
      # The MDBList live tests skip themselves unless their instrumentation argument is set,
      # so this run needs no network credentials.
      # It reuses the cached AVD (force-avd-creation: false) and never saves over its snapshot
      # (-no-snapshot-save), so the next run starts from the same state.
      # scripts/connected-tests.sh limits each attempt to 15 minutes and retries once when adb or
      # the emulator fails, but never after a test failure (#490). The step limit leaves room for
      # the emulator boot and both attempts, so a hang fails well before the job limit.
      - name: Instrumented tests
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/connected-tests.sh :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
