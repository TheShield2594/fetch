name: CI

on:
  push:
    branches: [main]
    # The website under web/ has its own workflows (web-*.yml).
    paths-ignore:
      - "web/**"
      - ".github/workflows/web-*.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - ".github/workflows/web-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job builds without any private configuration: no keys, no sync server, debug signing.
# The job names below are the required status checks on `main`; renaming one means updating
# the branch protection rule too.
jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Fails when startup-prof.txt copies baseline-prof.txt or Fetch code is not covered
      # (docs/performance.md, section 2).
      - name: Baseline and start-up profiles
        run: |
          (cd scripts && python3 -m unittest tests.test_check_baseline_profiles)
          python3 scripts/check_baseline_profiles.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: fetch-debug
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  release:
    name: Release APK (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The minified, resource-shrunk release build, signed with the debug key. Catches R8
      # and keep-rule regressions before a manual release does.
      - name: Assemble release APK
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator on the hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the app and test APKs before the emulator starts, so emulator time is test time.
      - name: Build test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      # An Android TV 14 emulator at 1080p, the same image baseline-profile.yml records on: the
      # UI tests assume a landscape TV screen and D-pad (non-touch) focus, and fail on a phone.
      # The MDBList live tests skip themselves unless their instrumentation argument is set,
      # so this run needs no network credentials.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
