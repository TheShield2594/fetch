         Opening the connection alongside the app's own JS takes that setup off

    <title>Fetch · Everything you watch, one place</title>
    <!-- For search results and link previews. One set for the whole app, since
         this is the only HTML there is; it describes Fetch rather than a page.
         og:image is absolute because most link-preview crawlers ignore a
         relative one. -->

    <!-- Starts the Shelf's opening requests during HTML parse, before the app
         bundle has finished downloading. Without this the first byte of data
         cannot be asked for until the entry chunk has arrived and been parsed,
         React has mounted, and the Shelf's effect has run — on a phone that
         ordering leaves the connection idle for several hundred milliseconds.

         Inline rather than a <script src>: an external classic script blocks the
         parser until it has been fetched and run, which would delay discovery of
         the module preloads below and cost more than the head start is worth.

         Everything here is best-effort. A missing token, an unusual deployment,
         a rejected fetch: all fall through silently and the app fetches
         normally. It must never throw, and never be why a page fails to start. -->
    <script>
      (function () {
        "use strict";

        try {
          // Only the landing route. Any other entry point renders a different page,
          // and these responses would be fetched for nothing.
          if (window.location.pathname !== "/") return;

          var base = (window.__FETCH_API_BASE__ || "").replace(/\/+$/, "");
          if (!base) return;

          // The session and a PIN profile's access are HttpOnly cookies, sent
          // by `credentials: "include"` below; the session id beside them is
          // not a secret, just the sign that there is a session at all.
          var sessionId = window.localStorage.getItem("fetch_session_id");
          var profileId = window.localStorage.getItem("fetch_profile_id");
          // No session means the setup wizard, no profile means the profile
          // picker — neither of which shows any of this. A token still in
          // localStorage from before the cookies is moved by main.tsx first.
          if (!sessionId || !profileId) return;
          if (window.localStorage.getItem("fetch_token")) return;

          // The same headers api/client.ts sends, so the service worker files
          // the answers under the same cache key.
          var headers = {
            "X-Fetch-Client": "web",
            "X-Fetch-Session": sessionId,
            "x-profile-id": profileId,
          };

          // These must stay character-for-character what api.ts requests, since that
          // is how it recognises them. A mismatch is not a breakage — the response
          // goes unclaimed and the app fetches again — but it is a wasted request.
          //
          // The Shelf's two: the lists it is built from (which also gates the
          // per-list fan-out that follows, so it is the more valuable head start
          // of the two) and what is part-way watched. The check-in and the
          // one-row history are cheap and only decorate a string, so they wait
          // their turn.
          var paths = ["/lists", "/series/progress"];

          var preloaded = {};
          for (var i = 0; i < paths.length; i++) {
            (function (path) {
              preloaded[path] = fetch(base + path, { headers: headers, credentials: "include" }).catch(function () {
                // Claimed and discarded by api.ts, which then fetches normally.
                return null;
              });
            })(paths[i]);
          }

          window.__FETCH_PRELOAD__ = preloaded;
        } catch {
          // Private-mode localStorage, a blocked fetch, anything at all — startup
          // matters more than this optimisation.
        }
      })();
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
      /* The FETCH wordmark on its dot matrix with a band of accent sweeping
         across it — the same loader the app draws once it has hydrated
         (FetchLoader.tsx), so a cold start doesn't hand over from one wait to
         a different-looking one. Each column is a <g> whose delay times the
         sweep. theme-init.js sets --loader-accent from the live theme's
         --accent before this paints; the fallback is the default Fetch theme's
         accent, the theme a page opens on when that script did not run. */
      #initial-loader g {
        fill: rgb(150, 150, 150);
        opacity: 0.3;
        animation: initial-loader-sweep 2.1s cubic-bezier(0.32, 0.72, 0, 1) infinite;
      }
      @keyframes initial-loader-sweep {
        0%, 40%, 100% { fill: rgb(150, 150, 150); opacity: 0.3; }
        12% { fill: var(--loader-accent, #dc2b33); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader g { animation: none; opacity: 0.6; }
      }
      #root:not(:empty) ~ #initial-loader {
        display: none;
      }
    </style>
