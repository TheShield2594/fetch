name: CI

on:
  push:
    branches: [main]
    # The website under web/ has its own workflows (web-*.yml).
    paths-ignore:
      - "web/**"
      - ".github/workflows/web-*.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - ".github/workflows/web-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Builds without any private configuration: no keys, no sync server, debug signing.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleFullDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fetch-full-debug
          path: app/build/outputs/apk/full/debug/*universal*.apk
          if-no-files-found: warn
