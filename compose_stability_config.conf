// Classes that should be treated as stable by the Compose compiler.
// This prevents unnecessary recompositions for classes that are effectively immutable.
// See: https://developer.android.com/develop/ui/compose/performance/stability/fix

// Domain models
com.fetch.tv.domain.model.*

// UI state classes
com.fetch.tv.ui.screens.search.SearchUiState
com.fetch.tv.ui.screens.search.DiscoverCatalog
com.fetch.tv.ui.components.PosterCardStyle

// Read-only collection interfaces. Declared stable so a composable taking a List/Map/Set can
// skip; the price is a contract: never mutate a collection after handing it to a composable
// (pass a new instance instead), or the UI will not update. Checked in the audit (#454) and
// kept: dropping it would stop skipping across most of the UI, and it is what the Compose
// documentation suggests for this case.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// Home screen UI state (enables skipping for entire home)
com.fetch.tv.ui.screens.home.HomeUiState
com.fetch.tv.ui.screens.home.ModernCarouselItem
com.fetch.tv.ui.screens.home.FocusedCatalogSelection
com.fetch.tv.ui.screens.home.ModernHeroSceneState
com.fetch.tv.ui.screens.home.HomeScreenFocusState
com.fetch.tv.ui.screens.home.ModernPayload
com.fetch.tv.ui.screens.home.ModernPayload.Catalog
com.fetch.tv.ui.screens.home.ModernPayload.CollectionFolder
com.fetch.tv.ui.screens.home.ModernPayload.ContinueWatching
com.fetch.tv.ui.screens.home.HeroPreview