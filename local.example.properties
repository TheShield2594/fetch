sdk.dir=/path/to/Android/sdk

# --- Optional API client IDs (features that need them stay hidden when blank) ---
TMDB_API_KEY=
TRAKT_CLIENT_ID=
TRAKT_CLIENT_SECRET=
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
SIMKL_CLIENT_ID=
SIMKL_APP_NAME=fetch
MDBLIST_CLIENT_ID=
PREMIUMIZE_CLIENT_ID=
# Skip-intro markers for non-anime titles (IntroDB-compatible API).
INTRODB_API_URL=

# --- Optional default sync server ---
# Fetch has no hosted backend. Leave these blank for local-only builds; users can still
# connect their own server from Settings → Account. Fill them to bake in a self-hosted
# Supabase-compatible server as the default.
FETCH_SUPABASE_URL=
FETCH_SUPABASE_ANON_KEY=
FETCH_SUPABASE_FALLBACK_URL=
AVATAR_PUBLIC_BASE_URL=

# --- Optional playback issue reports ---
# Only shown in the app when set; point it at an endpoint you control.
PLAYBACK_REPORTS_BASE_URL=

# --- Release signing (debug signing is used when these are missing) ---
FETCH_RELEASE_STORE_FILE=
FETCH_RELEASE_KEY_ALIAS=
FETCH_RELEASE_KEY_PASSWORD=
FETCH_RELEASE_STORE_PASSWORD=

# --- Local FFmpeg decoder module (optional) ---
USE_LOCAL_FFMPEG_DECODER=false
FFMPEG_SOURCE_DIR=
FFMPEG_BUILD_DIR=

# --- DV7 / libdovi (Dolby Vision profile 7 → 8.1), optional ---
DOVI_NATIVE_ENABLED=false
DOVI_EXTRACTOR_HOOK_READY=false
DOVI_ENABLE_REAL_LINK=false
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
