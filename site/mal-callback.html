<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="robots" content="noindex">
  <title>Fetch · MyAnimeList sign-in</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #15181d; --muted: #59616e; --card: #fff; --accent: #2d6cdf; --error: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --fg: #e8eaee; --muted: #a3abb8; --card: #1a1f27; --accent: #6b9bff; --error: #ff8a80; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 520px; background: var(--card); border-radius: 16px; padding: 24px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--muted); }
    textarea { width: 100%; height: 7.5em; padding: 12px; border-radius: 10px; border: 1px solid var(--muted); background: transparent; color: inherit; font: 14px/1.4 ui-monospace, monospace; word-break: break-all; resize: none; }
    button { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .error { color: var(--error); }
    [hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <section id="ok" hidden>
    <h1>Almost done</h1>
    <p>Copy this code, go back to the Fetch page on your phone, and paste it under MyAnimeList. It only works for a few minutes.</p>
    <textarea id="code" readonly aria-label="Sign-in code"></textarea>
    <button id="copy" type="button">Copy code</button>
    <p id="copied" role="status" style="margin:12px 0 0"></p>
  </section>
  <section id="failed" hidden>
    <h1>Sign-in didn’t finish</h1>
    <p class="error" id="reason"></p>
    <p>Go back to the Fetch page on your phone and tap “Sign in to MyAnimeList” again.</p>
  </section>
</main>
<script>
  // Everything stays in this page: the code is read from the address and never sent anywhere.
  // On its own it can't sign anyone in: the TV also needs the sign-in's one-time secret, which
  // went to MyAnimeList in the sign-in link and never comes to this page.
  (function () {
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    if (code) {
      document.getElementById('ok').hidden = false;
      var field = document.getElementById('code');
      field.value = code;
      document.getElementById('copy').addEventListener('click', function () {
        var done = function () { document.getElementById('copied').textContent = 'Copied.'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, function () { field.select(); document.execCommand('copy'); done(); });
        } else {
          field.select(); document.execCommand('copy'); done();
        }
      });
      // Drop the code from the address bar and history once it is on screen.
      history.replaceState(null, '', location.pathname);
    } else {
      document.getElementById('failed').hidden = false;
      document.getElementById('reason').textContent =
        params.get('error') === 'access_denied' ? 'You didn’t allow Fetch.' : 'MyAnimeList didn’t send a code.';
    }
  })();
</script>
</body>
</html>
