# The Android TV and desktop apps (Gradle, versions in gradle/libs.versions.toml), the
# website's dependencies under web/, and the GitHub Actions every workflow uses.
version: 2
updates:
  # Reads gradle/libs.versions.toml plus the few versions still written in build files
  # (ffmpeg-decoder-downmix/, shared/, desktop/). The app's CI gates (unit tests, lint, the R8
  # release build and the emulator tests in ci.yml) run on every pull request, these included.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # A dependency goes to the first group it matches, so the narrow groups come first.
    groups:
      # Kotlin, its Compose compiler and serialization plugins (all `kotlin` in the catalog)
      # and KSP: KSP is built against a Kotlin release and rejects a newer one, so they move
      # as one PR.
      kotlin:
        patterns:
          # Not "org.jetbrains.kotlin*": that would also catch kotlinx (coroutines,
          # serialization), which release on their own schedule.
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      # The Android Gradle plugin; application, library and test share `agp`.
      android-gradle-plugin:
        patterns:
          - "com.android.application"
          - "com.android.library"
          - "com.android.test"
          - "com.android.tools.build*"
      # The Hilt runtime, its compiler and its Gradle plugin share `hilt` and must match.
      hilt:
        patterns:
          - "com.google.dagger*"
      # The Compose BOM, the TV Compose libraries and Compose Multiplatform for the desktop.
      compose:
        patterns:
          - "androidx.compose*"
          - "androidx.tv*"
          - "org.jetbrains.compose*"
      # The runtime, compiler and ktx artifacts share `room`, and the compiler writes code
      # the runtime of the same version reads.
      room:
        patterns:
          - "androidx.room*"
      androidx:
        patterns:
          - "androidx.*"
        update-types:
          - "minor"
          - "patch"
      # Everything else, minor and patch only: a major version (OkHttp 5, checker-qual 4)
      # gets a PR of its own.
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The decoder AARs in app/libs/ (FFmpeg, AV1, IAMF, MPEG-H) are built from the Media3
      # sources of the same release and call into Media3 internals, so a Media3 bump on its
      # own builds but can crash in the decoders at run time. Media3 moves by hand, together
      # with rebuilt AARs (app/libs/README.md).
      - dependency-name: "androidx.media3:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # CodeQL's init and analyze steps must run the same version or analyze
      # fails with a configuration error, so they move as one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint's peer range on typescript stops at <6.1.0, and it
      # throws on load rather than degrading, so `pnpm lint` hard-errors on
      # anything past 6.0.x -- a 6.1 minor breaks it just as surely as 7.0.
      # Leaving patch bumps alone keeps 6.0.x security fixes flowing. Drop
      # this ignore once typescript-eslint ships TS 7 support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # web/docker-compose.yml, for the digest-pinned postgres image. Compose files are
  # their own ecosystem — the "docker" one below only reads Dockerfiles.
  - package-ecosystem: "docker-compose"
    directory: "/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/web/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/web/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/web/apps/addon"
    schedule:
      interval: "weekly"
